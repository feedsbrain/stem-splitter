; stem-splitter configuration.
;
; audio_dir / video_dir control where downloaded videos and split stems are
; saved. Leave blank (or delete this file) to use the defaults shown below.
;
; - Absolute paths are used as-is. Windows environment variables like
;   %USERPROFILE% are expanded, and ~ is expanded to your home folder.
; - Relative paths are resolved against this file's own folder.
;
; Example - save into your Music/Videos folders instead:
;   audio_dir = %USERPROFILE%\Music\stem-splitter
;   video_dir = %USERPROFILE%\Videos\stem-splitter

[paths]
audio_dir = audio
video_dir = video

; ROCm nightly package index used by "run.bat --setup" to install
; torch/torchaudio/torchvision/rocm for YOUR AMD GPU. gfx103X-dgpu (RDNA2,
; e.g. RX 6000 series) is just the default - browse
; https://rocm.nightlies.amd.com/v2-staging/ for other targets, e.g.
; gfx110X-dgpu (RDNA3, RX 7000 series) or gfx1151 (Strix Halo APUs).
; Only read at setup time - changing this after venv\ already has torch
; installed has no effect until you delete venv\ and rerun --setup.
[rocm]
index_url = https://rocm.nightlies.amd.com/v2-staging/gfx103X-dgpu/
